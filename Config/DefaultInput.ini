[/Script/Engine.InputSettings]
; 示例工程用旧式动作映射触发技能：按下 / 松开都会转发给 Lua（K2_OnAbilityInput）。
; 为什么不用 Enhanced Input：它需要 InputAction / MappingContext 资产，
; 一加就破坏"clone 下来直接能跑"。真实项目换成 Enhanced Input 时，
; 只需改 AAKDemoCharacter::SetupPlayerInputComponent，Lua 侧不用动。
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; 槽位 0：鼠标左键 / 数字键 1 —— 近战挥砍
; 槽位 1：鼠标右键 / 数字键 2 —— 引导火球（按住不放才算吟唱）
+ActionMappings=(ActionName="UAK_Ability1",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=LeftMouseButton)
+ActionMappings=(ActionName="UAK_Ability1",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=One)
+ActionMappings=(ActionName="UAK_Ability2",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=RightMouseButton)
+ActionMappings=(ActionName="UAK_Ability2",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Two)
