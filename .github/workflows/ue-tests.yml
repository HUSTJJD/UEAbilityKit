name: UE Build & Tests

# 完整编译 + 跑自动化 + 生成报告。
# GitHub 托管 runner 装不了 UE，因此跑在**自托管 runner**上（机器上需已装 UE 5.8）。
# 跑完后把 docs/reports、docs/showcase.md 提交回仓库，由 docs.yml 渲染成 Pages。

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Automation 过滤条件'
        required: false
        default: 'UAK'
      capture_media:
        description: '是否采集截图/录屏（需要真实 RHI）'
        required: false
        default: 'false'

jobs:
  test:
    runs-on: [ self-hosted, Windows, UE ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run tests
        shell: pwsh
        run: |
          $args = @{ Filter = '${{ github.event.inputs.filter || ''UAK'' }}' }
          if ('${{ github.event.inputs.capture_media }}' -eq 'true') { $args.CaptureMedia = $true }
          ./Scripts/run_tests.ps1 @args

      - name: Upload raw artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uak-automation
          path: |
            Saved/Automation
            Saved/UAKAutomation

      - name: Commit report back
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reports docs/showcase.md
          git diff --staged --quiet || git commit -m "chore: update automation report"
          git push
