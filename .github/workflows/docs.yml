name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Ensure generated docs exist
        # 测试报告与 Showcase 由 run_tests 生成后才存在；
        # 没跑过测试时补占位文件，避免 mkdocs 因 nav 缺页而失败。
        run: |
          mkdir -p docs/reports
          [ -f docs/reports/latest.md ] || printf '# 测试报告\n\n尚未运行测试。\n' > docs/reports/latest.md
          [ -f docs/showcase.md ] || printf '# Showcase\n\n尚未运行测试。\n' > docs/showcase.md
      - name: Build docs
        run: mkdocs build --site-dir _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
