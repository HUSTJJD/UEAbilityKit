name: Repo hygiene

# 仓库里不许出现本机路径 / 引擎 GUID —— 这类东西一进仓库，别人 clone 下来就是坏的。
# 本机相关的配置一律走：命令行参数（-LyraPath / -EngineRoot）、环境变量
# （UE_ENGINE_ROOT / UE_ENGINE_GUID）、或 Tools/lyra_patches.local.json（已 gitignore）。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-local-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 跟踪的文件里没有本机路径 / 引擎 GUID
        run: python Tools/check_no_local_paths.py
